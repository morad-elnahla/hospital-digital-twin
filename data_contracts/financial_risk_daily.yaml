table: financial_risk_daily
data_version: csv-snapshot-2026-11-09
source: data/financial_risk_daily.csv
primary_key: [metric_date, department_id]
relations:
  - department_id -> departments.department_id
kpi_mappings:
  - name: daily risk estimates
    columns: total_revenue_at_risk_egp
    mapping: department_id + metric_date; synthetic estimate
columns: [metric_date, department_id, cancelled_surgery_margin_at_risk_egp, delayed_surgery_margin_loss_egp, lwbs_revenue_at_risk_egp, boarding_cost_egp, total_revenue_at_risk_egp]
