name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Build database
        run: python -m db.generate_schema && python -m db.build_db && python -m db.evaluate_forecasts && python -m db.validate_data
      - name: Run Python files in separate processes
        run: python scripts/run_tests.py
      - name: Contract keys
        run: python -m pytest tests/test_contract_keys.py -q
